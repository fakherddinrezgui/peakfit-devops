# ============================================================
# Secret MySQL — Données sensibles encodées en base64
# Ces valeurs correspondent exactement au docker-compose.yml
#
# Décodage pour vérifier :
#   echo "cm9vdHBhc3N3b3Jk" | base64 -d  → rootpassword
#   echo "cGVha2ZpdA==" | base64 -d       → peakfit
#   echo "cGVha2ZpdDEyMw==" | base64 -d   → peakfit123
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: peakfit
  labels:
    app: mysql
    project: peakfit
type: Opaque
data:
  # echo -n "rootpassword" | base64
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk

  # echo -n "peakfit" | base64
  MYSQL_DATABASE: cGVha2ZpdA==

  # echo -n "peakfit" | base64
  MYSQL_USER: cGVha2ZpdA==

  # echo -n "peakfit123" | base64
  MYSQL_PASSWORD: cGVha2ZpdDEyMw==
