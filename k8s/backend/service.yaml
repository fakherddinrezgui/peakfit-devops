# ============================================================
# Service Backend — NodePort
#
# NodePort expose le backend sur un port fixe de chaque node
# Accessible via : http://NODE_IP:30091
#
# On utilise NodePort (pas LoadBalancer) pour économiser
# le budget AWS Academy (pas de ALB supplémentaire)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: peakfit
  labels:
    app: backend
    project: peakfit
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      # Port du Service dans le cluster
      port: 8091
      # Port du conteneur Spring Boot
      targetPort: 8091
      # Port exposé sur chaque node EC2
      # Accessible via http://EC2_IP:30091
      nodePort: 30091
