# ============================================================
# Deployment Frontend React
# Nginx écoute sur le port 3000 (défini dans Dockerfile.frontend)
# REACT_APP_API_URL est bakée dans le build — pas d'env runtime
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: peakfit
  labels:
    app: frontend
    project: peakfit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        project: peakfit
    spec:
      containers:
        - name: frontend
          # Image ECR buildée avec REACT_APP_API_URL=http://54.173.208.56:30091
          image: 634166838788.dkr.ecr.us-east-1.amazonaws.com/peakfit-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Nginx est léger — probe rapide
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
