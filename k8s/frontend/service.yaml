# ============================================================
# Service Frontend — NodePort
# Accessible via http://NODE_IP:30003
# Port 3000 = port Nginx dans le conteneur
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: peakfit
  labels:
    app: frontend
    project: peakfit
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      # Port exposé sur chaque node EC2
      nodePort: 30003
