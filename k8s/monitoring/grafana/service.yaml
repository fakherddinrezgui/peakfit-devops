# ============================================================
# Service Grafana — NodePort 30030
# Accessible via http://NODE_IP:30030
# Login : admin / peakfit2024
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: monitoring
  labels:
    app: grafana
    project: peakfit
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30030
