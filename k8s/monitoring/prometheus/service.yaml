# ============================================================
# Service Prometheus — NodePort
# Accessible via http://NODE_IP:30090
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: monitoring
  labels:
    app: prometheus
    project: peakfit
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
      # Port externe pour accéder à l'UI Prometheus
      nodePort: 30090
