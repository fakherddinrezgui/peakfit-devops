# ============================================================
# RBAC Prometheus — Role Based Access Control
#
# Prometheus scrape les métriques K8s via l'API server
# Il a besoin de permissions pour lister/lire :
# - les pods (pour découvrir les targets)
# - les nodes (pour les métriques système)
# - les services et endpoints
# ============================================================

# ── ServiceAccount ───────────────────────────────────────────
# Identité utilisée par le pod Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    project: peakfit

---
# ── ClusterRole ──────────────────────────────────────────────
# Définit les permissions au niveau du cluster entier
# (pas juste un namespace — Prometheus surveille tout)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    project: peakfit
rules:
  # Lire les pods, services, endpoints, nodes
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]

  # Lire les ingress
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

  # Accès aux métriques brutes
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs: ["get"]

---
# ── ClusterRoleBinding ───────────────────────────────────────
# Lie le ClusterRole au ServiceAccount prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    project: peakfit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
