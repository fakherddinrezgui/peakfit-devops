version: "3.8"

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_APP_API_URL=http://localhost:8091
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    image: eclipse-temurin:17-jre-alpine
    working_dir: /app
    command: java -jar peakfit-backend.jar
    volumes:
      - ./backend:/app
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/peakfit
      - SERVER_PORT=8091
      - JWT_SECRET=peakfit-secret-2026
    expose:
      - "8091"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    restart: unless-stopped

volumes:
  mongo_data:
