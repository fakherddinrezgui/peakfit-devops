version: "3.8"

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: peakfit-frontend:latest
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    image: peakfit-backend:latest
    expose:
      - "8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/peakfit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=peakfit
      - SPRING_DATASOURCE_PASSWORD=peakfit123
      - JWT_SECRET=peakfit_secret_2026_change_this_key_ok
      - JWT_EXPIRATION=604800000
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=peakfit
      - MYSQL_USER=peakfit
      - MYSQL_PASSWORD=peakfit123
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    restart: unless-stopped

volumes:
  mysql_data:
