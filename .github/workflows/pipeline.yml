name: PeakFit CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend
        run: |
          docker build \
            -f peakFit/Dockerfile.backend \
            -t peakfit-backend:latest \
            peakFit/

      - name: Build Frontend
        run: |
          docker build \
            -f peakFit/Dockerfile.frontend \
            -t peakfit-frontend:latest \
            peakFit/

      - name: Sauvegarder images
        run: |
          docker save peakfit-backend:latest  -o backend.tar
          docker save peakfit-frontend:latest -o frontend.tar

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: "*.tar"
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: ./

      - name: Configurer cle SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" | sed 's/\\n/\n/g' > ~/.ssh/peakfit-key.pem
          chmod 600 ~/.ssh/peakfit-key.pem

      - name: Deploy sur EC2-1
        run: |
          IP="100.48.216.132"
          
          # Transfert des fichiers
          scp -i ~/.ssh/peakfit-key.pem -o StrictHostKeyChecking=no \
            backend.tar frontend.tar \
            ansible/docker-compose.yml ansible/nginx.conf \
            ec2-user@$IP:/tmp/
          
          # Déploiement via SSH
          ssh -i ~/.ssh/peakfit-key.pem -o StrictHostKeyChecking=no ec2-user@$IP << 'SSHEOF'
            set -e
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Docker Compose
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-linux-x86_64" \
              -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            
            # Prépare le dossier
            sudo mkdir -p /opt/peakfit
            sudo cp /tmp/docker-compose.yml /opt/peakfit/
            sudo cp /tmp/nginx.conf /opt/peakfit/
            
            # Charge les images
            sudo docker load -i /tmp/backend.tar
            sudo docker load -i /tmp/frontend.tar
            
            # Lance les containers
            cd /opt/peakfit
            sudo /usr/local/bin/docker-compose down || true
            sudo /usr/local/bin/docker-compose up -d
            
            sudo docker ps
          SSHEOF

      - name: Deploy sur EC2-2
        run: |
          IP="54.161.131.120"
          
          scp -i ~/.ssh/peakfit-key.pem -o StrictHostKeyChecking=no \
            backend.tar frontend.tar \
            ansible/docker-compose.yml ansible/nginx.conf \
            ec2-user@$IP:/tmp/
          
          ssh -i ~/.ssh/peakfit-key.pem -o StrictHostKeyChecking=no ec2-user@$IP << 'SSHEOF'
            set -e
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-linux-x86_64" \
              -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            
            sudo mkdir -p /opt/peakfit
            sudo cp /tmp/docker-compose.yml /opt/peakfit/
            sudo cp /tmp/nginx.conf /opt/peakfit/
            
            sudo docker load -i /tmp/backend.tar
            sudo docker load -i /tmp/frontend.tar
            
            cd /opt/peakfit
            sudo /usr/local/bin/docker-compose down || true
            sudo /usr/local/bin/docker-compose up -d
            
            sudo docker ps
          SSHEOF

      - name: URL finale
        run: echo "http://peakfit-alb-1215627608.us-east-1.elb.amazonaws.com"
